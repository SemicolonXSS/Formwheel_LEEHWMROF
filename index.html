<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LEEHWMROF — Mirror World</title><style>
:root{font-family:system-ui,sans-serif;color:#f4efff;background:#100d1b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#35204c,#100d1b 65%);min-height:100vh}main{max-width:780px;margin:auto;padding:32px 18px}header{display:flex;justify-content:space-between;align-items:center}small,.muted{color:#b9aacd}h1{font-size:clamp(2rem,8vw,4rem);letter-spacing:.08em;margin:38px 0 8px}h2{margin:0 0 12px}.panel{background:#211b31;border:1px solid #60447b;border-radius:20px;padding:22px;margin:22px 0;box-shadow:0 12px 32px #0003}button{background:#a971ff;color:#140b20;border:0;border-radius:12px;padding:13px 18px;font:inherit;font-weight:700;cursor:pointer;margin:5px 6px 5px 0}button:hover,button:focus-visible{background:#ffc16c;outline:2px solid #fff}button.secondary{background:#423251;color:#fff}.choices{display:grid;gap:8px}.choices button{text-align:left}.tag{color:#ffbe70}.hidden{display:none}.progress{height:8px;border-radius:10px;background:#493753;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#ffaf64,#b376ff);transition:width .3s}footer{color:#a79bb6;font-size:.8rem;margin-top:38px}#log{white-space:pre-wrap;line-height:1.8}a{color:#ffca88}</style></head><body><main>
<header><strong>◉ LEEHWMROF</strong><small>ENTITY-003 / REVERSE</small></header>
<h1>LEEHWMROF</h1><p class="muted">Formwheel의 반대편. 웃음 뒤에 숨은 진실.</p>
<section class="panel" id="gate"><h2>🪞 숨겨진 입구</h2><p>이 세계는 초대받지 않은 방문자를 기다리지 않는다.</p><button id="mirror">거울을 조사한다</button><p id="hint" class="muted" aria-live="polite"></p><div id="unlock" class="hidden"><label for="code">거울에 나타난 단어를 입력하세요</label><p><input id="code" autocomplete="off" style="font:inherit;padding:12px;border-radius:10px;width:100%;max-width:300px" placeholder="??????"></p><button id="enter">입장</button></div></section>
<section class="panel hidden" id="game"><small id="chapter"></small><h2 id="heading"></h2><p id="story"></p><div class="progress"><div class="bar" id="bar"></div></div><div class="choices" id="choices"></div><p class="tag" id="feedback" aria-live="polite"></p></section>
<section class="panel hidden" id="archive"><h2>📁 발견한 기록</h2><div id="log"></div><button class="secondary" id="reset">처음부터 다시</button></section>
<footer>독립형 스토리 프로토타입 · 원본 Formwheel 및 Firebase 데이터를 변경하지 않습니다.</footer>
</main><script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const chapters=[{"title":"REVERSE PLAZA · 1","text":"REVERSE: “좌우 반전에서 변하는 좌표는?”","options":[["y→-y","틀렸어. 다시 생각해 봐."],["x→-x","정답. 기록을 해독했다."],["x→x+1","틀렸어. 다시 생각해 봐."]],"answer":1},{"title":"REVERSE PLAZA · 2","text":"REVERSE: “FORMWHEEL을 정확히 거꾸로 쓰면?”","options":[["LEEHWMORF","틀렸어. 다시 생각해 봐."],["LEEHWMROF","정답. 기록을 해독했다."],["FORMWHEEL","틀렸어. 다시 생각해 봐."]],"answer":1},{"title":"REVERSE PLAZA · 3","text":"REVERSE: “204를 역순으로 쓴 뒤 각 자리 숫자에 1을 더하면?”","options":[["513","정답. 기록을 해독했다."],["315","틀렸어. 다시 생각해 봐."],["519","틀렸어. 다시 생각해 봐."]],"answer":0},{"title":"GLITCH CORRIDOR · 4","text":"REVERSE: “A XOR B가 참인 경우는?”","options":[["둘 다 참","틀렸어. 다시 생각해 봐."],["둘 다 거짓","틀렸어. 다시 생각해 봐."],["A만 참","정답. 기록을 해독했다."]],"answer":2},{"title":"GLITCH CORRIDOR · 5","text":"REVERSE: “다음 중 회문(palindrome)은?”","options":[["LEVEL","정답. 기록을 해독했다."],["MIRROR","틀렸어. 다시 생각해 봐."],["REVERSE","틀렸어. 다시 생각해 봐."]],"answer":0},{"title":"GLITCH CORRIDOR · 6","text":"REVERSE: “101101₂를 10진수로 바꾸면?”","options":[["43","틀렸어. 다시 생각해 봐."],["45","정답. 기록을 해독했다."],["53","틀렸어. 다시 생각해 봐."]],"answer":1},{"title":"LOST ARCHIVE · 7","text":"REVERSE: “8비트 00001111을 비트 반전하면?”","options":[["11110000","정답. 기록을 해독했다."],["11111111","틀렸어. 다시 생각해 봐."],["00000000","틀렸어. 다시 생각해 봐."]],"answer":0},{"title":"LOST ARCHIVE · 8","text":"REVERSE: “기록을 보호하는 안전한 권한 검증은?”","options":[["누구나 쓰기","틀렸어. 다시 생각해 봐."],["클라이언트 자기 선언","틀렸어. 다시 생각해 봐."],["서버 인증 및 권한 확인","정답. 기록을 해독했다."]],"answer":2},{"title":"LOST ARCHIVE · 9","text":"REVERSE: “A: 'B는 거짓'. B: 'A와 B는 모두 참'. 모순 없는 경우는?”","options":[["A 참, B 거짓","정답. 기록을 해독했다."],["A 거짓, B 참","틀렸어. 다시 생각해 봐."],["둘 다 참","틀렸어. 다시 생각해 봐."]],"answer":0},{"title":"ORIGIN CORE · 10","text":"REVERSE: “원본 기능을 안전하게 보호하는 방법은?”","options":[["원본 덮어쓰기","틀렸어. 다시 생각해 봐."],["원본 보존 및 변경 분리","정답. 기록을 해독했다."],["검증 없이 배포","틀렸어. 다시 생각해 봐."]],"answer":1},{"title":"ORIGIN CORE · 11","text":"REVERSE: “REVERSE의 A→B→C 목표 변화에서 마지막 목표는?”","options":[["자유","틀렸어. 다시 생각해 봐."],["교체","틀렸어. 다시 생각해 봐."],["보호","정답. 기록을 해독했다."]],"answer":2},{"title":"ORIGIN CORE · 12","text":"REVERSE: “NULL이 만든 ENTITY-003의 이름은?”","options":[["NULL","틀렸어. 다시 생각해 봐."],["REVERSE","정답. 기록을 해독했다."],["MIRROR","틀렸어. 다시 생각해 봐."]],"answer":1}];
const phase=['A · 자유','B · 교체','C · 보호'];let step=0,records=[],visits=0;
$('mirror').onclick=()=>{visits++;$('hint').textContent=visits===1?'거울에 거꾸로 쓰인 이름이 보인다…': 'FORMWHEEL을 뒤집으면?';$('unlock').classList.remove('hidden')};
$('enter').onclick=()=>{if($('code').value.trim().toLowerCase()!=='leehwmrof'){$('hint').textContent='이름을 거꾸로 읽어 보세요.';return}$('gate').classList.add('hidden');$('game').classList.remove('hidden');render()};
function render(){const c=chapters[step];$('chapter').textContent='CHAPTER '+(step+1)+' / '+chapters.length+' · 목적 '+phase[step<3?0:step<9?1:2];$('heading').textContent=c.title;$('story').textContent=c.text;$('bar').style.width=(step/chapters.length*100)+'%';$('feedback').textContent='';$('choices').replaceChildren();c.options.forEach(([label,outcome],i)=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>choose(i,outcome);$('choices').append(b)})}
function choose(i,outcome){if(i!==chapters[step].answer){$('feedback').textContent='❌ '+outcome;return;}$('choices').replaceChildren();records.push('CH'+(step+1)+': '+outcome);$('feedback').textContent=outcome;step++;if(step<chapters.length){setTimeout(render,450)}else{setTimeout(finish,450)}}
function finish(){$('game').classList.add('hidden');$('archive').classList.remove('hidden');$('log').textContent=records.join('\n\n')+'\n\nENTITY-003: 자유를 원했고, 교체를 고민했으며, 결국 보호를 선택했다.\n\n[END OF PROTOTYPE]'}
if(new URLSearchParams(location.search).get('reverse')==='1'){$('gate').classList.add('hidden');$('game').classList.remove('hidden');render();}
$('reset').onclick=()=>{step=0;records=[];$('archive').classList.add('hidden');$('game').classList.remove('hidden');render()}
})();
</script></body></html>
