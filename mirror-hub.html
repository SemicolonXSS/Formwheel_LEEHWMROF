<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formwheel · ???</title><style>:root{font-family:system-ui,sans-serif;color:#20283c;background:#f6f7fc}*{box-sizing:border-box}body{margin:0}.mirror{transform:scaleX(-1);min-height:100vh}header{background:white;border-bottom:1px solid #ddd;padding:20px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:24px;font-weight:900;color:#4640aa;cursor:default}main{max-width:1180px;margin:auto;padding:28px 18px}.hero{text-align:center;padding:32px 12px}.hero h1{font-size:clamp(26px,6vw,42px)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.card{border:1px solid #e1e2ed;border-radius:17px;background:white;padding:20px;min-height:115px;box-shadow:0 4px 12px #0001}.card strong{display:block;font-size:20px}.card p{color:#687084}.card button,.door{border:0;border-radius:11px;padding:11px 15px;background:#5149b9;color:white;font:inherit;cursor:pointer}.door{background:#302044;margin-top:22px}.notice{min-height:25px;color:#8b3f68;text-align:center}.muted{color:#6c7487}.search{padding:13px;width:min(100%,430px);border:1px solid #d3d5e5;border-radius:12px;font:inherit}button:focus-visible{outline:3px solid #ffac57;outline-offset:3px}</style></head><body><div class="mirror"><header><span class="logo" aria-label="Formwheel 로고, 이 세계에서는 링크가 연결되지 않음">◉ Formwheel</span><span class="muted">Hub</span></header><main><div class="hero"><h1>🌠 나만의 우주, 새로운 프로젝트를 탐험하자!</h1><p>원하는 프로젝트를 찾아보세요.</p><input class="search" id="search" placeholder="프로젝트 검색" aria-label="프로젝트 검색"><p class="notice" id="notice" role="status"></p></div><div class="cards" id="cards"></div><div style="text-align:center"><button class="door" id="return">LEEHWMROF로 다시 들어가기 ···</button><p class="muted">뭔가 이상한데…?</p></div></main></div><script>(()=>{'use strict';const items=[["🎡","Wheel","돌림판"],["⚔️","Battle","퀴즈 대전"],["🧩","Quiz","퀴즈"],["🍳","Cook","요리"],["🎵","Music","음악"],["🔮","AQS","업적과 Secret"],["⚡","Reflex","반응속도"],["⏳","Time","시간 게임"],["🎲","Dice Duel","주사위"],["🕵️","Spy","스파이"],["🗺️","Maze","미로"],["♟️","Board","보드게임"],["⚽","Sports","스포츠"],["💬","Chat","채팅"],["🔧","Tools","도구"],["🔐","Vault","금고"],["📖","Wiki","위키"],["🎹","Piano","피아노"],["🧠","Decode","암호 해독"],["🌌","Story","이야기"],["🎯","Risk","위험 선택"],["🏆","GCrown","왕관"],["🧪","Glitch","글리치"],["🌀","Marble","구슬"]];const cards=document.getElementById('cards'),notice=document.getElementById('notice');function draw(q=''){cards.replaceChildren();items.filter(x=>x[1].toLowerCase().includes(q.toLowerCase())).forEach(([emoji,name,desc])=>{const card=document.createElement('div');card.className='card';const title=document.createElement('strong');title.textContent=emoji+' '+name;const p=document.createElement('p');p.textContent=desc;const btn=document.createElement('button');btn.textContent='열기';btn.onclick=()=>notice.textContent='오류: 이쪽 세계에서는 연결할 수 없습니다.';card.append(title,p,btn);cards.append(card)});}document.getElementById('search').oninput=e=>draw(e.target.value);document.getElementById('return').onclick=()=>location.assign('./index.html?reverse=1');draw()})();</script></body></html>
