<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>??? · Mirror Trail</title><style>body{font:16px/1.65 system-ui,sans-serif;background:#130f20;color:#f0eaff;margin:0}main{max-width:620px;margin:8vh auto;padding:20px}section{border:1px solid #70558c;border-radius:18px;padding:24px;background:#251b36}input,button{font:inherit;padding:12px;border-radius:10px}input{background:#fff;color:#222;width:min(90%,350px)}button{background:#b48bff;color:#170e28;border:0;cursor:pointer;margin-top:12px}a{color:#ffd098}.muted{color:#c7b8d8}#result{white-space:pre-wrap}small{color:#bca9d0}</style></head><body><main><p><a href="https://semicolonxss.github.io/Formwheel_AQS/">← AQS Secret</a></p><section><small>UNKNOWN RECORD / MIRROR TRAIL</small><h1 id="title">???</h1><p id="prompt">세 개의 흔적을 추적하세요. 이 퍼즐은 별도의 체험판이며 AQS 업적을 자동 지급하지 않습니다.</p><label for="answer">해독 결과</label><p><input id="answer" autocomplete="off" spellcheck="false"></p><button id="submit">확인</button><p id="result" role="status" aria-live="polite"></p><p class="muted" id="progress">흔적 0 / 3</p></section></main><script>
(()=>{'use strict';let stage=0;const puzzles=[
{hint:'흔적 1 — 거울에는 단어가 뒤집혀 있다. 다음 글자를 정상 순서로 읽어라: RORRIM',answers:['mirror'],success:'기록 01: 거울은 현실을 복제한다.'},
{hint:'흔적 2 — 거울이 가리키는 세계의 원래 이름은 FORMWHEEL이다. 이 이름을 거꾸로 써라.',answers:['leehwmrof'],success:'기록 02: 뒤집힌 세계의 이름이 밝혀졌다.'},
{hint:'흔적 3 — NULL의 실험체 식별 번호는 ENTITY-003이다. 번호 세 자리를 입력하라.',answers:['003'],success:'기록 03: REVERSE가 당신을 인식했다.'}
];const $=id=>document.getElementById(id);function render(){if(stage===3){$('title').textContent='??? → LEEHWMROF';$('prompt').textContent='세 흔적이 하나의 문으로 이어진다. 이 입구는 탐험용 퍼즐이며 서버 검증 보상은 아직 없다.';$('answer').hidden=true;$('submit').textContent='거울 세계로 이동';$('submit').onclick=()=>location.assign('./mirror-hub.html');$('progress').textContent='흔적 3 / 3';return}$('title').textContent='??? · '+(stage+1)+'/3';$('prompt').textContent=puzzles[stage].hint;$('progress').textContent='흔적 '+stage+' / 3';$('answer').value='';$('answer').focus()}$('submit').onclick=()=>{const value=$('answer').value.trim().toLowerCase().replace(/\s/g,'');if(!puzzles[stage].answers.includes(value)){$('result').textContent='아직 일치하지 않아. 단서를 다시 확인해 봐.';return}$('result').textContent=puzzles[stage].success;stage++;render()};$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')$('submit').click()});render()})();
</script></body></html>
